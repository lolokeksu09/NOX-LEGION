name: Build NOX APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Structural regression tests
        run: python3 -m unittest discover -s tests -p 'verify_structure.py' -v
      - name: Install GLSL validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
      - name: Validate OpenGL shaders
        run: python3 tests/verify_glsl.py
      - name: Unit tests
        run: gradle :core:model:test --stacktrace
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-1.9-overdrive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
